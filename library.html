<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>资源库 — CL Nav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/portal.css" />
  <style>
    .page {
      --side-gap: 0.85rem;
      width: min(calc(1180px + var(--side-w) + var(--side-gap)), calc(100% - 1rem));
      margin: 0 auto;
      padding: 0.85rem 0.5rem 2.5rem;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: var(--side-gap);
      align-items: start;
    }

    .shell-top {
      grid-column: 1 / -1;
      grid-row: 1;
      min-width: 0;
    }

    .side-wrap {
      grid-column: 1;
      grid-row: 2;
      position: sticky;
      top: 0.85rem;
      z-index: 5;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.45rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .lib-side {
      display: grid;
      gap: 0.25rem;
    }

    .lib-side button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 0.5rem 0.55rem;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }

    .lib-side button:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .lib-side button.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .lib-side em {
      font-style: normal;
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      padding: 0.05rem 0.35rem;
      border-radius: 999px;
    }

    .side-top {
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 0.55rem 0.2rem 0.2rem;
      cursor: pointer;
    }

    .side-top:hover { color: var(--accent); }

    .shell-main {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      display: grid;
      gap: 0.75rem;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
      padding: 0.35rem 0 0.55rem;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }
    .tagline { color: var(--muted); font-size: 12px; margin-left: 0.15rem; }

    .top-nav {
      margin-left: auto;
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .top-nav a {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .top-nav a:hover,
    .top-nav a.active { color: var(--accent); }
    .top-nav .mirror-switch {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      color: var(--accent);
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
    }
    .top-nav .mirror-switch:hover {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .lib-hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.05rem;
      display: grid;
      gap: 0.75rem;
    }

    .lib-hero h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .lib-hero p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      max-width: 52rem;
    }

    .lib-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
    }

    .lib-search {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      overflow: hidden;
    }

    .lib-search input {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0.55rem 0.75rem;
      font: inherit;
      color: var(--ink);
      outline: none;
    }

    .lib-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 10px;
      padding: 0.5rem 0.85rem;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .lib-btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--accent); }
    .lib-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .lib-btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
    .lib-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .lib-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.3rem 0.65rem;
    }

    .lib-status {
      min-height: 1.2em;
      font-size: 12px;
      color: var(--muted);
    }
    .lib-status.ok { color: #059669; }
    .lib-status.err { color: #dc2626; }
    .lib-status.warn { color: #d97706; }

    .lib-list {
      display: grid;
      gap: 0.55rem;
    }

    .lib-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      padding: 0.85rem 0.95rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .lib-card-main { min-width: 0; display: grid; gap: 0.35rem; }
    .lib-card-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }
    .lib-card-title strong { font-size: 14px; }
    .lib-card-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .lib-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 0.85rem;
      color: var(--muted);
      font-size: 11px;
    }
    .lib-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 0.1rem 0.45rem;
    }
    .lib-tag.muted {
      color: var(--muted);
      background: var(--bg);
    }
    .lib-card-actions { flex-shrink: 0; }

    .lib-empty {
      padding: 2.2rem 1rem;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .lib-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      padding: 0.2rem 0.15rem 0;
    }

    .search-actions {
      display: flex;
      gap: 0.35rem;
    }

    .search-actions button {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--muted);
    }

    .search-actions button:hover,
    .search-actions button.active {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
      background: var(--accent-soft);
    }

    @media (max-width: 860px) {
      .page {
        grid-template-columns: 1fr;
      }
      .side-wrap {
        position: static;
        grid-column: 1;
      }
      .lib-side {
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        overflow-x: auto;
      }
      .shell-main { grid-column: 1; }
      .lib-card { flex-direction: column; align-items: stretch; }
      .lib-card-actions { align-self: flex-end; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell-top">
      <header class="header-row">
        <a class="brand-wrap" href="index.html" title="返回导航首页">
          <div class="brand-mark">CL</div>
          <div>
            <div class="brand">CL <span>Nav</span></div>
          </div>
          <span class="tagline">资源库</span>
        </a>
        <nav class="top-nav" id="topNav" aria-label="主导航"></nav>
        <div class="search-actions" aria-label="主题">
          <button type="button" data-theme-btn="light" title="浅色">☀</button>
          <button type="button" data-theme-btn="dark" title="深色">☾</button>
        </div>
      </header>
    </div>

    <aside class="side-wrap">
      <nav class="lib-side" id="libSide" aria-label="资源分类"></nav>
      <button type="button" class="side-top" id="backTop" title="返回顶部">↑ 顶部</button>
    </aside>

    <div class="shell-main">
      <section class="lib-hero">
        <div>
          <h1>资源库</h1>
          <p>
            集中浏览与下载软件、安装包等资源。本页仅提供下载；上传与删除请登录后在「设置 → 资源库」管理。
          </p>
        </div>
        <div class="lib-toolbar">
          <div class="lib-search">
            <input id="libSearch" type="search" placeholder="搜索资源名称、说明、平台…" autocomplete="off" />
          </div>
          <span class="lib-badge" id="storageBadge">存储：GitHub Releases / 外链</span>
        </div>
        <p class="lib-status" id="libStatus"></p>
      </section>

      <div class="lib-list" id="libList"></div>
      <div class="lib-empty" id="libEmpty" hidden>
        <p>此分类暂无资源</p>
      </div>

      <p class="lib-note">
        文件可经设置上传到 GitHub Releases，或登记外链。管理：设置（需登录）→「资源库」。
      </p>
    </div>
  </div>

  <script src="shared/data.js"></script>
  <script src="shared/auth.js"></script>
  <script src="shared/portal.js"></script>
  <script src="shared/library-data.js"></script>
  <script src="shared/library.js"></script>
  <script>
    LibraryUI.init();
  </script>
</body>
</html>
