<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 8 · 高密度卡片</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/portal.css" />
  <style>
    body { font-size: 12px; }
    .util-bar { padding: 0.22rem 0.85rem; font-size: 11px; }
    .back-bar { padding: 0.35rem 0.85rem; font-size: 11px; }
    .shell { width: min(1180px, calc(100% - 1.1rem)); margin: 0 auto; padding-bottom: 1.5rem; }

    .header-row {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.5rem 0 0.2rem; flex-wrap: wrap;
    }
    .brand { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; white-space: nowrap; }
    .brand span { color: var(--accent); }
    .switch-hint { font-size: 11px; color: var(--muted); }
    .top-nav { display: flex; flex-wrap: wrap; gap: 0.1rem 0.7rem; margin-left: auto; font-size: 12px; font-weight: 500; }
    .top-nav a:hover { color: var(--accent); }

    .search-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.4rem;
    }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px;
    }
    .search-box { border-radius: 8px; }
    .search-box select { padding: 0 0.5rem; font-size: 12px; }
    .search-box input { padding: 0.5rem 0.7rem; font-size: 12px; }
    .search-box button { padding: 0 0.9rem; font-size: 12px; }
    .search-actions { display: flex; gap: 0.3rem; color: var(--muted); font-size: 11px; }
    .search-actions a {
      width: 30px; height: 30px; border-radius: 8px; background: var(--panel);
      border: 1px solid var(--line); display: grid; place-items: center;
    }
    .hot-tags { gap: 0.4rem; margin-top: 0.35rem; font-size: 11px; }

    .body-grid {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 0.55rem;
      margin-top: 0.65rem;
      align-items: start;
    }
    .side-wrap {
      position: sticky; top: 0.5rem;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px; box-shadow: var(--shadow);
      padding: 0.25rem 0.15rem;
    }
    .side-menu a { padding: 0.35rem 0.15rem; font-size: 11px; border-radius: 6px; }

    .card {
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(31, 36, 48, 0.04);
    }
    .card-h { margin-bottom: 0.4rem; font-size: 12px; }
    .card-h .more { font-size: 11px; }

    .main-stack { display: grid; gap: 0.55rem; }
    .links-wrap {
      display: flex; flex-wrap: wrap; gap: 0;
    }
    .links-wrap .icon-link {
      gap: 0.25rem;
      padding: 0.18rem 0.3rem;
      border-radius: 4px;
      font-size: 12px;
    }
    .links-wrap .icon-link img {
      width: 14px; height: 14px; border-radius: 3px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.15rem 0.55rem;
    }
    .tools-grid a {
      padding: 0.22rem 0.15rem;
      border-radius: 4px;
      color: var(--ink);
      border-bottom: 1px dotted #e8ecf2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tools-grid a:hover { color: var(--accent); background: #f8fafc; }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }
    .widgets { display: grid; gap: 0.55rem; }
    .music { padding: 0.55rem; gap: 0.55rem; border-radius: 8px; }
    .music .cover { width: 40px; height: 40px; border-radius: 6px; }
    .music strong { font-size: 12px; }
    .music span { font-size: 10px; }
    .news-list { gap: 0.28rem; }
    .add-card { min-height: 56px; border-radius: 8px; font-size: 12px; }

    @media (max-width: 900px) {
      .tools-grid { grid-template-columns: repeat(3, 1fr); }
      .bottom-grid { grid-template-columns: 1fr; }
      .search-row { grid-template-columns: 1fr; }
      .logo-mark, .search-actions { display: none; }
    }
    @media (max-width: 640px) {
      .body-grid { grid-template-columns: 1fr; }
      .side-wrap { position: static; }
      .side-menu { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0.15rem; }
      .side-menu a { padding: 0.3rem 0.45rem; }
      .tools-grid { grid-template-columns: repeat(2, 1fr); }
      .top-nav { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="back-bar">
    <a href="../../index.html">← 返回方案列表</a>
    <span>方案 8 · 高密度卡片</span>
  </div>

  <div class="util-bar">
    <span id="dateText"></span>
    <div class="right" id="topUtils"></div>
  </div>

  <div class="shell">
    <div class="header-row">
      <div class="brand">CL <span>Nav</span></div>
      <span class="switch-hint">开发者工具导航</span>
      <nav class="top-nav" id="topNav"></nav>
    </div>

    <div class="search-row">
      <div class="logo-mark">CL</div>
      <form class="search-box" id="searchForm">
        <select id="engine" aria-label="搜索引擎"></select>
        <input id="q" type="search" placeholder="搜索工具、文档、AI…" autocomplete="off" />
        <button type="submit">搜索</button>
      </form>
      <div class="search-actions">
        <a href="#" title="设置">⚙</a>
        <a href="#" title="皮肤">◐</a>
      </div>
    </div>
    <div class="hot-tags" id="hotTags"></div>

    <div class="body-grid">
      <aside class="side-wrap">
        <nav class="side-menu" id="sideMenu"></nav>
      </aside>

      <div class="main-stack">
        <section class="card" id="common">
          <div class="card-h"><span>常用</span><a class="more" href="#">更多</a></div>
          <div class="links-wrap" id="commonLinks"></div>
        </section>

        <section class="card" id="ai">
          <div class="card-h"><span>AI</span><a class="more" href="#">更多</a></div>
          <div class="links-wrap" id="aiLinks"></div>
        </section>

        <section class="card" id="tools">
          <div class="card-h"><span>工具箱</span><a class="more" href="#">全部</a></div>
          <div class="tools-grid" id="toolsLinks"></div>
        </section>

        <div class="bottom-grid">
          <div class="widgets">
            <div class="music">
              <div class="cover"></div>
              <div style="flex:1;min-width:0">
                <strong>深夜写代码</strong>
                <span>Lo-fi Beats · Portal FM</span>
                <div class="bar"><i></i></div>
              </div>
            </div>
            <section class="card">
              <div class="card-h"><span>热门资讯</span><a class="more" href="#">更多</a></div>
              <ul class="news-list" id="hotNews"></ul>
            </section>
          </div>
          <div class="main-stack">
            <section class="card" id="mail">
              <div class="card-h"><span>邮箱</span><a class="more" href="#">更多</a></div>
              <div class="links-wrap" id="mailLinks"></div>
            </section>
            <section class="card" id="cloud">
              <div class="card-h"><span>云服务</span><a class="more" href="#">更多</a></div>
              <div class="links-wrap" id="cloudLinks"></div>
            </section>
            <a class="add-card" href="#">+ 添加自定义模块</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../shared/data.js"></script>
  <script src="../../shared/portal.js"></script>
  <script>
    const D = NAV_DATA;
    document.getElementById("dateText").textContent = D.dateText;
    document.getElementById("topUtils").innerHTML = Portal.topUtils();
    document.getElementById("topNav").innerHTML = Portal.topNav();
    document.getElementById("engine").innerHTML = Portal.engineOptions();
    document.getElementById("hotTags").innerHTML = Portal.hotTags();
    document.getElementById("sideMenu").innerHTML = Portal.sideMenu("common");
    document.getElementById("commonLinks").innerHTML = Portal.iconLinks(D.common);
    document.getElementById("aiLinks").innerHTML = Portal.iconLinks(D.ai);
    document.getElementById("toolsLinks").innerHTML = (D.tools || [])
      .map((t) => `<a href="${t.url}">${t.title}</a>`)
      .join("");
    document.getElementById("mailLinks").innerHTML = Portal.iconLinks(D.mail);
    document.getElementById("cloudLinks").innerHTML = Portal.iconLinks(D.cloud);
    document.getElementById("hotNews").innerHTML = Portal.hotNews();
    Portal.bindSearch("#searchForm", "#engine", "#q");
  </script>
</body>
</html>
