<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 1 · 经典门户 — CL Nav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/portal.css" />
  <style>
    .header-row {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0.55rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .brand span { color: var(--accent); }
    .switch-hint {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      padding: 0.2rem 0.5rem;
      border: 1px dashed var(--line);
      border-radius: 6px;
    }
    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 1rem;
      margin-left: auto;
      font-size: 13px;
      font-weight: 500;
    }
    .top-nav a:hover { color: var(--accent); }

    .search-row {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1rem 0.35rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .logo-mark {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .logo-mark .mark {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
    .search-row .search-box { max-width: 640px; width: 100%; }
    .search-actions {
      display: flex;
      gap: 0.45rem;
      color: var(--muted);
    }
    .search-actions button {
      width: 36px; height: 36px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
    }
    .search-actions button:hover { color: var(--accent); border-color: #bfdbfe; }

    .hot-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem 0.85rem;
      padding-left: calc(120px + 2rem);
    }

    .shell {
      display: grid;
      grid-template-columns: var(--side-w) 1fr;
      gap: 0.85rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.5rem 1rem 2rem;
      align-items: start;
    }
    .side {
      position: sticky;
      top: 0.75rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.4rem 0.25rem;
    }
    .main { display: grid; gap: 0.85rem; min-width: 0; }
    .links-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.15rem;
    }
    .pills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .below {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 0.85rem;
      align-items: start;
    }
    .col { display: grid; gap: 0.85rem; }
    .settings-ico::before { content: "⚙"; }
    .skin-ico::before { content: "◐"; }
    .full-ico::before { content: "⛶"; }

    @media (max-width: 860px) {
      .header-row { flex-wrap: wrap; }
      .top-nav { margin-left: 0; width: 100%; }
      .search-row {
        grid-template-columns: 1fr;
        justify-items: stretch;
      }
      .search-actions { justify-content: flex-end; }
      .hot-wrap { padding-left: 1rem; }
      .shell { grid-template-columns: 1fr; }
      .side { position: static; display: flex; flex-direction: row; overflow-x: auto; }
      .side-menu { flex-direction: row; }
      .side-menu a { white-space: nowrap; padding: 0.45rem 0.7rem; }
      .below { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="back-bar">
    <a href="../../index.html">← 返回预览首页</a>
    <span>方案 1 · 经典门户（最接近参考图）</span>
  </div>

  <div class="util-bar">
    <span id="dateText"></span>
    <div class="right" id="topUtils"></div>
  </div>

  <div class="header-row">
    <div class="brand">CL <span>Nav</span></div>
    <span class="switch-hint">切换风格</span>
    <nav class="top-nav" id="topNav"></nav>
  </div>

  <div class="search-row">
    <div class="logo-mark">
      <div class="mark">CL</div>
      <span>CL Nav</span>
    </div>
    <form class="search-box" id="searchForm" action="#" method="get">
      <select id="engine" aria-label="搜索引擎"></select>
      <input id="q" type="search" placeholder="输入关键词搜索…" autocomplete="off" />
      <button type="submit">搜索</button>
    </form>
    <div class="search-actions">
      <button type="button" class="settings-ico" title="设置" aria-label="设置"></button>
      <button type="button" class="skin-ico" title="皮肤" aria-label="皮肤"></button>
      <button type="button" class="full-ico" title="全屏" aria-label="全屏"></button>
    </div>
  </div>
  <div class="hot-wrap">
    <div class="hot-tags" id="hotTags"></div>
  </div>

  <div class="shell">
    <aside class="side">
      <nav class="side-menu" id="sideMenu"></nav>
    </aside>
    <div class="main">
      <section class="card" id="common">
        <div class="card-h"><span>常用</span><a class="more" href="#">更多</a></div>
        <div class="links-wrap" id="commonLinks"></div>
      </section>
      <section class="card" id="ai">
        <div class="card-h"><span>AI</span><a class="more" href="#">更多</a></div>
        <div class="links-wrap" id="aiLinks"></div>
      </section>
      <section class="card" id="tools">
        <div class="card-h"><span>工具箱</span><a class="more" href="#">更多</a></div>
        <div class="pills-wrap" id="toolPills"></div>
      </section>
      <div class="below">
        <div class="col">
          <div class="music">
            <div class="cover"></div>
            <div style="flex:1;min-width:0">
              <strong>深夜代码电台</strong>
              <span>Lo-fi · Developer Mix</span>
              <div class="bar"><i></i></div>
            </div>
          </div>
          <section class="card">
            <div class="card-h"><span>热门资讯</span><a class="more" href="#">更多</a></div>
            <ul class="news-list" id="hotNews"></ul>
          </section>
        </div>
        <div class="col">
          <section class="card" id="mail">
            <div class="card-h"><span>邮箱</span><a class="more" href="#">更多</a></div>
            <div class="links-wrap" id="mailLinks"></div>
          </section>
          <section class="card" id="cloud">
            <div class="card-h"><span>云服务</span><a class="more" href="#">更多</a></div>
            <div class="links-wrap" id="cloudLinks"></div>
          </section>
          <a class="add-card" href="#">＋ 添加卡片</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../shared/data.js"></script>
  <script src="../../shared/portal.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("dateText").textContent = NAV_DATA.dateText;
      document.getElementById("topUtils").innerHTML = Portal.topUtils();
      document.getElementById("topNav").innerHTML = Portal.topNav();
      document.getElementById("engine").innerHTML = Portal.engineOptions();
      document.getElementById("hotTags").innerHTML = Portal.hotTags();
      document.getElementById("sideMenu").innerHTML = Portal.sideMenu();
      document.getElementById("commonLinks").innerHTML = Portal.iconLinks(NAV_DATA.common);
      document.getElementById("aiLinks").innerHTML = Portal.iconLinks(NAV_DATA.ai);
      document.getElementById("toolPills").innerHTML = Portal.pillTools(NAV_DATA.tools);
      document.getElementById("mailLinks").innerHTML = Portal.iconLinks(NAV_DATA.mail);
      document.getElementById("cloudLinks").innerHTML = Portal.iconLinks(NAV_DATA.cloud);
      document.getElementById("hotNews").innerHTML = Portal.hotNews();
      Portal.bindSearch("#searchForm", "#engine", "#q");
    });
  </script>
</body>
</html>
