<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案 9 · 挂件左侧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/portal.css" />
  <style>
    .shell { width: min(1180px, calc(100% - 1.5rem)); margin: 0 auto; padding-bottom: 2rem; }
    .header-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.75rem 0 0.35rem; flex-wrap: wrap;
    }
    .brand { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; white-space: nowrap; }
    .brand span { color: var(--accent); }
    .switch-hint { font-size: 12px; color: var(--muted); }
    .top-nav { display: flex; flex-wrap: wrap; gap: 0.15rem 0.9rem; margin-left: auto; font-size: 13px; font-weight: 500; }
    .top-nav a:hover { color: var(--accent); }

    .search-row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 0.75rem;
      align-items: center;
      margin-top: 0.55rem;
    }
    .logo-mark {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px;
    }
    .search-actions { display: flex; gap: 0.45rem; color: var(--muted); font-size: 12px; }
    .search-actions a {
      width: 36px; height: 36px; border-radius: 10px; background: var(--panel);
      border: 1px solid var(--line); display: grid; place-items: center;
    }
    .search-actions a:hover { color: var(--accent); border-color: #bfdbfe; }

    .cat-chips {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      margin-top: 0.9rem;
      padding: 0.45rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }
    .cat-chips a {
      padding: 0.32rem 0.75rem;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .cat-chips a:hover,
    .cat-chips a.active {
      background: #eff6ff;
      color: var(--accent);
    }

    .split {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 0.85rem;
      margin-top: 0.9rem;
      align-items: start;
    }
    .left-rail {
      position: sticky; top: 0.75rem;
      display: grid; gap: 0.85rem;
    }
    .right-stack { display: grid; gap: 0.85rem; }
    .links-wrap { display: flex; flex-wrap: wrap; gap: 0.2rem 0.15rem; }
    .pills-wrap { display: flex; flex-wrap: wrap; gap: 0.45rem; }

    @media (max-width: 960px) {
      .split { grid-template-columns: 1fr; }
      .left-rail { position: static; grid-template-columns: 1fr 1fr; }
      .left-rail .add-card { grid-column: 1 / -1; }
      .search-row { grid-template-columns: 1fr; }
      .logo-mark, .search-actions { display: none; }
    }
    @media (max-width: 640px) {
      .left-rail { grid-template-columns: 1fr; }
      .cat-chips { border-radius: 12px; }
      .top-nav { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="back-bar">
    <a href="../../index.html">← 返回方案列表</a>
    <span>方案 9 · 挂件左侧</span>
  </div>

  <div class="util-bar">
    <span id="dateText"></span>
    <div class="right" id="topUtils"></div>
  </div>

  <div class="shell">
    <div class="header-row">
      <div class="brand">CL <span>Nav</span></div>
      <span class="switch-hint">开发者工具导航</span>
      <nav class="top-nav" id="topNav"></nav>
    </div>

    <div class="search-row">
      <div class="logo-mark">CL</div>
      <form class="search-box" id="searchForm">
        <select id="engine" aria-label="搜索引擎"></select>
        <input id="q" type="search" placeholder="搜索工具、文档、AI…" autocomplete="off" />
        <button type="submit">搜索</button>
      </form>
      <div class="search-actions">
        <a href="#" title="设置">⚙</a>
        <a href="#" title="皮肤">◐</a>
      </div>
    </div>
    <div class="hot-tags" id="hotTags"></div>

    <nav class="cat-chips" id="catChips"></nav>

    <div class="split">
      <aside class="left-rail">
        <div class="music">
          <div class="cover"></div>
          <div style="flex:1;min-width:0">
            <strong>深夜写代码</strong>
            <span>Lo-fi Beats · Portal FM</span>
            <div class="bar"><i></i></div>
          </div>
        </div>
        <section class="card">
          <div class="card-h"><span>热门资讯</span><a class="more" href="#">更多</a></div>
          <ul class="news-list" id="hotNews"></ul>
        </section>
        <a class="add-card" href="#">+ 添加自定义模块</a>
      </aside>

      <div class="right-stack">
        <section class="card" id="common">
          <div class="card-h"><span>常用</span><a class="more" href="#">更多</a></div>
          <div class="links-wrap" id="commonLinks"></div>
        </section>
        <section class="card" id="ai">
          <div class="card-h"><span>AI</span><a class="more" href="#">更多</a></div>
          <div class="links-wrap" id="aiLinks"></div>
        </section>
        <section class="card" id="tools">
          <div class="card-h"><span>工具箱</span><a class="more" href="#">全部</a></div>
          <div class="pills-wrap" id="toolsLinks"></div>
        </section>
        <section class="card" id="mail">
          <div class="card-h"><span>邮箱</span><a class="more" href="#">更多</a></div>
          <div class="links-wrap" id="mailLinks"></div>
        </section>
        <section class="card" id="cloud">
          <div class="card-h"><span>云服务</span><a class="more" href="#">更多</a></div>
          <div class="links-wrap" id="cloudLinks"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="../../shared/data.js"></script>
  <script src="../../shared/portal.js"></script>
  <script>
    const D = NAV_DATA;
    document.getElementById("dateText").textContent = D.dateText;
    document.getElementById("topUtils").innerHTML = Portal.topUtils();
    document.getElementById("topNav").innerHTML = Portal.topNav();
    document.getElementById("engine").innerHTML = Portal.engineOptions();
    document.getElementById("hotTags").innerHTML = Portal.hotTags();
    document.getElementById("catChips").innerHTML = Portal.sideMenu("common");
    document.getElementById("commonLinks").innerHTML = Portal.iconLinks(D.common);
    document.getElementById("aiLinks").innerHTML = Portal.iconLinks(D.ai);
    document.getElementById("toolsLinks").innerHTML = Portal.pillTools(D.tools);
    document.getElementById("mailLinks").innerHTML = Portal.iconLinks(D.mail);
    document.getElementById("cloudLinks").innerHTML = Portal.iconLinks(D.cloud);
    document.getElementById("hotNews").innerHTML = Portal.hotNews();
    Portal.bindSearch("#searchForm", "#engine", "#q");
  </script>
</body>
</html>
