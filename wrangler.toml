# Cloudflare Pages — Functions + KV（资源库目录不依赖 R2 / 绑卡）
name = "cl-nav"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

[[kv_namespaces]]
binding = "CL_NAV_SYNC"
id = "fbfee28c0c54443fb8d4aabc9b68880b"

# 强一致同步 v2（/api/sync2）使用的 D1。
# 已创建：npx wrangler d1 create cl-nav-sync
# 表结构：npx wrangler d1 execute cl-nav-sync --remote --file=./schema/sync.sql
[[d1_databases]]
binding = "CL_NAV_DB"
database_name = "cl-nav-sync"
database_id = "cfcb4c6a-482d-4743-8bd4-a3a03b0347b4"

[vars]
LIBRARY_ADMIN_PASS = "xiaochenbian"

# 以后若绑卡开通 R2，可取消下面注释并创建同名 bucket：
# [[r2_buckets]]
# binding = "CL_NAV_R2"
# bucket_name = "cl-nav-library"
